services:
  db:
    image: postgres:15-alpine
    container_name: school_tickets_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: PostgresPassword123
      POSTGRES_DB: school_tickets
    ports:
      - "5433:5432" # Can change to default port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
